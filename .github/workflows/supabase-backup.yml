name: Supabase weekly backup

# The free tier keeps no backups, and events/enquiries are volunteer-entered
# data — export everything to JSON in /backups once a week as cheap insurance.
on:
  schedule:
    - cron: "0 7 * * 0" # Sundays, 07:00 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Export tables to JSON
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/backup.mjs

      - name: Commit backups
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add backups
          git diff --cached --quiet && echo "Nothing new to back up" && exit 0
          git commit -m "Weekly Supabase backup ($(date -u +%F))"
          git push
